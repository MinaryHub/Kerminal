name: CI

on:
  push:
    branches: [main]
  # No branch filter: a PR targeting a feature branch (stacked work) would
  # otherwise merge with no verification at all.
  pull_request:
  # Runs the desktop builds too — see `build-desktop` below.
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift, etc.)
        run: dart run build_runner build

      # Informational only. The repo predates the Dart 3.7+ "tall" formatter
      # style, so `dart format` rewrites nearly every file; enforcing it here
      # would block all CI. Run `dart format .` once to adopt the new style and
      # this can be made blocking again (--set-exit-if-changed).
      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Runs on every push and PR. Linux runners are billed 1x.
  build:
    name: Build ${{ matrix.target }}
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
            build: flutter build web --release
          - os: ubuntu-latest
            target: apk
            build: flutter build apk --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart run flutter_launcher_icons
      - run: ${{ matrix.build }}

  # Manual only. This repo is private, where Actions minutes are metered and
  # multiplied by runner OS: Windows 2x, macOS 10x. A ~12-minute macOS build is
  # billed as ~120 minutes, so running these on every PR burned the whole
  # 2,000-minute monthly allowance in about a dozen runs.
  #
  # Desktop compilation is still verified — the release workflow builds Windows
  # and macOS for real on every tag. Run this job by hand (Actions → CI → Run
  # workflow) before tagging if a change touches desktop-specific code:
  # platform channels, window setup, file pickers, path handling.
  build-desktop:
    name: Build ${{ matrix.target }} (manual)
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            build: flutter build windows --release
          - os: macos-latest
            target: macos
            build: flutter build macos --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart run flutter_launcher_icons
      - run: ${{ matrix.build }}
