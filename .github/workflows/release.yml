name: Release

# Tag a commit to build release artifacts for every platform and attach them
# to a draft GitHub Release, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails in seconds instead of after ~20 minutes of builds. Releases go to a
  # different (public) repo via RELEASE_PAT, and a misconfigured PAT is only
  # discovered when the release is created — after every platform has built.
  # That happened once: five successful builds, then
  #   403 {"message":"Resource not accessible by personal access token"}
  # In a private repo those wasted minutes are billed (macOS 10x, Windows 2x).
  preflight:
    name: Check release token
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      PUBLIC_REPO: MinaryHub/kerminal
    steps:
      - name: RELEASE_PAT can write to the public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PAT is not set. Create a fine-grained PAT for ${PUBLIC_REPO} (Contents: read and write) and store it as RELEASE_PAT."
            exit 1
          fi
          # `permissions.push` is what the releases API checks. A token scoped to
          # the wrong repository 404s here; one with Contents:read reports false.
          if ! perms=$(gh api "repos/${PUBLIC_REPO}" --jq '.permissions.push' 2>&1); then
            echo "::error::RELEASE_PAT cannot read ${PUBLIC_REPO}. The token's Resource owner must be the MinaryHub organization (a personal-account PAT cannot reach org repos), and its repository access must include ${PUBLIC_REPO} — not the private source repo. API said: ${perms}"
            exit 1
          fi
          if [ "$perms" != "true" ]; then
            echo "::error::RELEASE_PAT lacks write access to ${PUBLIC_REPO} (permissions.push=${perms}). Set Permissions -> Repository -> Contents to 'Read and write'."
            exit 1
          fi
          echo "RELEASE_PAT can write to ${PUBLIC_REPO}."

  build:
    name: Build ${{ matrix.target }}
    # preflight only runs for tags. A skipped dependency would otherwise skip
    # this job too, breaking manual (workflow_dispatch) builds — so gate on the
    # result being anything other than an outright failure.
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    # Cloud credentials baked into the build via --dart-define (see each build
    # step). Empty when the secrets are unset → the app runs local-only.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Linux desktop build prerequisites (incl. libsecret for secure storage).
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Sign release APK/AAB with the stable release key. Without this the build
      # falls back to the debug keystore, which runners generate fresh each time —
      # every release would carry a different signature and Android would refuse
      # to update one build with the next (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      - if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to ship a debug-signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/kerminal-release.p12"
          # storeFile must be absolute: build.gradle.kts resolves a relative path
          # against android/app/, not android/. PKCS#12 uses one password for
          # both the store and the key.
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/kerminal-release.p12
          storeType=PKCS12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - run: dart run build_runner build
      # Regenerate per-platform launcher icons from assets/icon/app_icon.png so
      # the released apps always carry the current icon (done in CI since the
      # generated icons aren't committed).
      - run: dart run flutter_launcher_icons

      # --- Windows: MSIX installer, signed with the self-signed cert (CN=Minary).
      # Same signing path as windows-sideload.yml, which builds this on demand
      # from any branch without tagging. ---
      - if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # Derive the 4-part MSIX version from pubspec's single source of truth
          # (`version: X.Y.Z+B` -> `X.Y.Z.B`). The pubspec `msix_version` field is
          # a stale fallback; passing --version here guarantees the package version
          # increases each release so Windows performs an in-place update instead of
          # rejecting a same-version/different-content package (0x80073CFB).
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $parts = $raw -split '\+'
          $build = if ($parts.Count -gt 1) { $parts[1] } else { '0' }
          $msixVer = "$($parts[0]).$build"
          Write-Host "MSIX version: $msixVer (from pubspec '$raw')"
          # Named `kerminal-sideload.msix`, not `kerminal.msix`: this package is
          # for direct install only. It carries a revision number (X.Y.Z.B) and a
          # self-signed publisher, both of which Partner Center rejects. It has
          # been uploaded to the Store by mistake three times; the file name now
          # says which one it is. The Store package is `kerminal-store.msix`.
          # Inject cloud credentials into the underlying `flutter build windows`.
          $defs = "--dart-define=SUPABASE_URL=$($env:SUPABASE_URL) --dart-define=SUPABASE_ANON_KEY=$($env:SUPABASE_ANON_KEY)"
          if ($env:WINDOWS_CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            dart run msix:create --version $msixVer --output-name kerminal-sideload --windows-build-args "$defs" --certificate-path $pfx --certificate-password $env:WINDOWS_CERT_PASSWORD
          } else {
            Write-Host 'No signing secret; building with msix test certificate.'
            dart run msix:create --version $msixVer --output-name kerminal-sideload --windows-build-args "$defs"
          }
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/windows/x64/runner/Release/*.msix dist/ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist/*.msix)) { Compress-Archive build/windows/x64/runner/Release/* dist/kerminal-windows.zip }
          # Publish the public cert so users can trust it once before installing.
          Copy-Item windows/kerminal-codesign.cer dist/ -ErrorAction SilentlyContinue

      # --- macOS: .dmg with an /Applications shortcut ---
      # A zip of the .app gave no way to *replace* an existing install: users
      # unpacked it wherever the download landed and ended up with two copies.
      # A disk image makes the drag-onto-Applications flow explicit, which is
      # how macOS updates are normally applied.
      - if: matrix.target == 'macos'
        run: |
          flutter build macos --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          mkdir -p dist
          staging="$(mktemp -d)"
          cp -R build/macos/Build/Products/Release/kerminal.app "$staging/"
          # The symlink is what turns the window into "drag here to install".
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Kerminal -srcfolder "$staging" \
            -ov -format UDZO "$GITHUB_WORKSPACE/dist/kerminal-macos.dmg"
          rm -rf "$staging"

      # --- Linux: bundle tarball ---
      - if: matrix.target == 'linux'
        run: |
          flutter build linux --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          mkdir -p dist
          tar -czf dist/kerminal-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      # --- Android: APK + AAB (debug-signed unless key.properties provided) ---
      - if: matrix.target == 'android'
        run: |
          DEFS="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          flutter build apk --release $DEFS
          flutter build appbundle --release $DEFS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/kerminal.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/kerminal.aab

      # --- Web: static bundle ---
      - if: matrix.target == 'web'
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          mkdir -p dist
          tar -czf dist/kerminal-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: kerminal-${{ matrix.target }}
          path: dist/*

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Releases are published to the PUBLIC repo, not this one. This repo is
    # private (the source is not published), but three URLs must stay reachable
    # without authentication:
    #
    #   PUBLIC_REPO/releases/latest/download/latest.json   in-app update check
    #   PUBLIC_REPO/blob/main/PRIVACY.md                   MS Store policy 10.5.1
    #   PUBLIC_REPO/issues                                 in-app "Report an issue"
    #
    # The public repo kept the original name, so already-installed apps and the
    # Store listing need no change. Cross-repo publishing needs a PAT —
    # GITHUB_TOKEN is scoped to this repo only.
    env:
      PUBLIC_REPO: MinaryHub/kerminal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Generate the update manifest describing THIS release. The app polls
      # releases/latest/download/latest.json, so older versions detect it.
      # BASE points at the PUBLIC repo — github.repository is the private one.
      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="${{ github.server_url }}/${PUBLIC_REPO}/releases/download/${GITHUB_REF_NAME}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Kerminal ${VERSION}. See the release page for details.",
            "downloads": {
              "windows": "${BASE}/kerminal-sideload.msix",
              "macos": "${BASE}/kerminal-macos.dmg",
              "linux": "${BASE}/kerminal-linux-x64.tar.gz",
              "android": "${BASE}/kerminal.apk"
            }
          }
          EOF
          cat latest.json

      # Release notes come from CHANGELOG.md in THIS repo. `generate_release_notes`
      # is off on purpose: it would summarise the *public* repo's commits, which
      # only ever contains three documents.
      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for ${VERSION}; falling back to a generic note." >&2
            printf 'Kerminal %s.\n' "$VERSION" > notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ github.ref_name }}
          name: Kerminal ${{ github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/**/*
            latest.json

      # The privacy policy is a Store compliance document served from the public
      # repo. If it changes here, the public copy must follow or the submitted
      # URL shows a stale policy.
      - name: Sync PRIVACY.md to the public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" public
          cp PRIVACY.md public/PRIVACY.md
          cd public
          if git diff --quiet; then
            echo "PRIVACY.md already up to date."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -qam "docs: PRIVACY.md 동기화 (${GITHUB_REF_NAME})"
          git push -q
